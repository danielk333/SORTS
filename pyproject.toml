[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "sorts"
description = "Space Object Radar Tracking Simulator"
version = "5.0.0-rc.1"
requires-python = ">=3.12"
readme = { file = "README.md", content-type = "text/markdown" }
authors = [
  { name = "Daniel Kastinen", email = "daniel.kastinen@irf.se" },
  { name = "Tsz-Hin Heung" },
  { name = "Juha Vierinen" },
]
license = { file = "LICENSE" }
maintainers = [{ name = "Daniel Kastinen", email = "daniel.kastinen@irf.se" }]
classifiers = [
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Physics",
  "Operating System :: Unix",
]
# TODO: this is way to many deps, i think many are not used
dependencies = [
  "h5py>=3.10.0",      # has pre-built packages for Python 3.12
  "matplotlib>=3.8.4", # Enable building against numpy 2.0
  "numpy>=1.26.0",     # addition of Python 3.12.0 support
  "scipy>=1.13.0",     # support NumPy 2.0.0, and is backwards compatible to NumPy 1.22.4
  "sgp4>=2.7",
  "tabulate>=0.8.7",
  "tqdm>=4.46.0",
  "astropy>=6.1.0",    # compiled against NumPy 2.0
  "xmlschema>=1.5.1",
  "pyorb>=0.5.4",
  "pyant>=1.1",
  "yappi>=1.5.1",      # Add support for Python 3.12
  "requests>=2.32.3",
  "pandas>=2.2.2",     # compatible with numpy 2.0
  "pyqt6>=6.8.1",
  "bottleneck>=1.5.0",
  "mpi4py>=4.1.0",
  "h5netcdf>=1.6.4",
  "radardef>=0.3.2",
]


[project.urls]
Documentation = "https://danielk.developer.irf.se/sorts/"
Repository = "https://github.com/danielk333/sorts"

[project.optional-dependencies]
spacetrack = ["spacetrack>=1.0.1"]
jupyter = ["ipykernel>=6.29.5", "ipywidgets>=8.1.7", "jupyterlab>=4.4.4"]
dev = [
  "pytest>=6.2.5",
  "flake8>=4.0.1",
  "wheel>=0.37.0",
  "build>=0.7.0",
  "twine>=3.4.2",
  "pytest-cov>= 4.1.0",
  "matplotlib>=3.5.1",
  "ipykernel>=6.9.1",
  "radon>=5.1.0",
  "numpydoc>=1.2",
  "pre-commit> 3.0.0",
  "black>=23.3.0",
  "auditwheel>=5.4.0",
  "patchelf>=0.14",
  "watchfiles>=1.1.0",
  "mkdocs>=1.6.1",
  "mkdocs-gen-files>=0.5.0",
  "mkdocstrings[python]>=0.30.0",
  "mkdocs-section-index>=0.3.10",
  "mkdocs-literate-nav>=0.6.2",
  "jupytext>=1.17.2",
  "mkdocs-jupyter>=0.25.1",
]

# `dependency-groups` is a new feature, bascially like the old extras mechanism but only for dev deps
# - https://peps.python.org/pep-0735/
# - https://pip.pypa.io/en/stable/news/#id80
[dependency-groups]
dev = ["sorts"]

[tool.setuptools.package-data]
sorts = ["py.typed", "data/*"]

[tool.black]
line-length = 100

[tool.pyright]
reportPrivateImportUsage = "information"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-rp --capture=tee-sys"
log_format = "[%(asctime)s]%(levelname)s:%(name)s:%(message)s"
log_date_format = "%Y-%m-%d %H:%M:%S"
log_level = "INFO"
log_cli = true
testpaths = ["tests"]

[tool.uv]
# A workaround for using editable install modules wiht `uv` and `pylance`
# https://github.com/microsoft/pylance-release/blob/d7a084cb2086f22aa999e9392242d15acd53b327/TROUBLESHOOTING.md#editable-install-modules-not-found
config-settings = { editable_mode = "compat" }

[tool.uv.workspace]
members = ["."]

[tool.uv.sources]
sorts = { workspace = true, editable = true }
